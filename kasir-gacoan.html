<!-- kasir gacoan -->
<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kasir Mie & Dimsum</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <style>
        :root {
            color-scheme: dark;
            --bs-body-bg: #09090b;
            --bs-body-color: #f4f4f5;
            --accent: #38bdf8;
            --surface: #141417;
            --border: #29292e;
            --muted: #a1a1aa;
        }

        body {
            overflow: hidden;
            touch-action: manipulation;
            min-height: 100vh;
            /* background: radial-gradient(ellipse at top, #17202a 0%, #09090b 48%); */
            background: #000000;
            font-family: 'JetBrains Mono', monospace;
        }

        .btn {
            touch-action: manipulation;
            background: linear-gradient(145deg, #17212a, #121418);
            height: 50px;
            /* background: rgba(20, 20, 23, .92); */
        }

        .app {
            touch-action: manipulation;
            max-width: 540px;
            margin: auto;
            /* padding: 32px 16px; */
        }

        .order-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            /* margin-top: 10px; */
        }

        .qty-btn {
            /* width: 45px; */
            /* height: 45px; */
            flex-shrink: 0;
            border: 0px solid #3f3f46;
            border-radius: 14px;
            /* background: #27272a; */
            background: transparent;
            color: #fff;
            font-size: 26pt;
            display: grid;
            place-items: center;
            transition: background .15s, transform .15s;
            touch-action: manipulation;
        }

        .qty-btn:active {
            transform: scale(.7);
        }

        .qty-btn:hover {
            background: #3f3f46;
        }

        .qty-number {
            flex: 1;
            min-width: 0;
            text-align: center;
        }

        .qty-number strong {
            font-size: 24px;
            font-weight: 700;
        }

        .qty-number small {
            display: block;
            font-size: 11px;
            color: var(--muted);
            margin-top: 1px;
        }

        .summary {
            background: linear-gradient(145deg, #17212a, #121418);
            border: 1px solid #293b49;
            border-radius: 22px;
            padding: 20px;
            /* margin-top: 5px; */
        }

        .summary-label {
            color: #a1a1aa;
            font-size: 13px;
        }

        .summary-qty {
            font-size: 24px;
            font-weight: 700;
        }

        .summary-total {
            font-size: clamp(25px, 7vw, 32px);
            font-weight: 700;
            /* letter-spacing: -1.5px; */
            color: var(--accent);
            overflow-wrap: anywhere;
        }

        .tbl {
            transition: background .15s, transform .15s;
        }

        .tbl:active {
            transform: scale(.7);
        }
    </style>
</head>

<body>
    <main class="app p-3">

        <div class="d-flex my-3 gap-1 fixed-bottom p-3">
            <!-- Mie -->
            <div class="d-grid w-100 p-2 rounded-4" style="background: rgba(20, 20, 23, .92);">
                <div class="text-center fs-5">Mie</div>
                <div class="order-controls my-2">
                    <button class="qty-btn" onclick="ubahPorsi('mie', -1)" aria-label="Kurangi porsi mie">
                        <i class="fa-solid fa-square-minus"></i>
                    </button>

                    <div class="qty-number">
                        <strong id="mieQty">0</strong>
                    </div>

                    <button class="qty-btn" onclick="ubahPorsi('mie', 1)" aria-label="Tambah porsi mie">
                        <i class="fa-solid fa-square-plus"></i>
                    </button>
                </div>
                <div class="text-center" id="mieTotal">Rp0</div>
            </div>
            <!-- Dimsum -->
            <div class="d-grid w-100 p-2 rounded-4" style="background: rgba(20, 20, 23, .92);">
                <div class="text-center fs-5">Dimsum</div>
                <div class="order-controls my-2">
                    <button class="qty-btn" onclick="ubahPorsi('dimsum', -1)" aria-label="Kurangi porsi dimsum">
                        <i class="fa-solid fa-square-minus"></i>
                    </button>

                    <div class="qty-number">
                        <strong id="dimsumQty">1</strong>
                    </div>

                    <button class="qty-btn" onclick="ubahPorsi('dimsum', 1)" aria-label="Tambah porsi dimsum">
                        <i class="fa-solid fa-square-plus"></i>
                    </button>
                </div>
                <div class="text-center" id="dimsumTotal">Rp0</div>
            </div>
        </div>

        <!-- RINGKASAN -->
        <section class="summary border-0">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <div class="summary-label">Total Porsi</div>
                    <div class="summary-qty">
                        <span id="totalQty">0</span>
                        <span class="fs-6 fw-normal">porsi</span>
                    </div>
                </div>
            </div>

            <hr class="border-secondary">

            <div class="summary-label">Total Bayar</div>
            <div class="summary-total" id="grandTotal">Rp0</div>

            <hr class="border-secondary">

            <div class="summary-label">Uang</div>
            <div class="summary-total text-light" id="uang">Rp0</div>

            <hr class="border-secondary">

            <div class="summary-label">Kembalian</div>
            <div class="summary-total text-success" id="kembali">Rp0</div>

        </section>

        <div class="tbl text-center my-3 fs-1 text-danger" onclick="resetKasir()" type="button">
            <i class="fa-solid fa-trash"></i>
        </div>

        <!-- Uang -->
        <div class="d-flex mb-1 justify-content-center">
            <div class="btn-group w-100" role="group">
                <button type="button" class="btn rounded-start-4 tbl fs-5" id="resetUang" onclick="resetUang()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <button type="button" class="btn tbl" onclick="tambahUang(1000)">1rb</button>
                <button type="button" class="btn tbl" onclick="tambahUang(2000)">2rb</button>
                <button type="button" class="btn tbl" onclick="tambahUang(5000)">5rb</button>
                <button type="button" class="btn rounded-end-4 tbl" onclick="tambahUang(10000)">10rb</button>
            </div>
        </div>
        <div class="d-flex justify-content-center">
            <div class="btn-group w-100" role="group">
                <button type="button" class="btn rounded-start-4 tbl" onclick="tambahUang(15000)">15rb</button>
                <button type="button" class="btn tbl" onclick="tambahUang(20000)">20rb</button>
                <button type="button" class="btn tbl" onclick="tambahUang(30000)">30rb</button>
                <button type="button" class="btn tbl" onclick="tambahUang(50000)">50rb</button>
                <button type="button" class="btn rounded-end-4 tbl" onclick="tambahUang(100000)">100rb</button>
            </div>
        </div>

    </main>

    <script>

        const harga = {
            mie: 14000,
            dimsum: 13000
        };

        const porsi = {
            mie: 0,
            dimsum: 0
        };

        // Uang yang diterima dari pelanggan
        let uangDiterima = 0;

        const rupiah = angka =>
            'Rp' + angka.toLocaleString('id-ID');

        function ubahPorsi(menu, perubahan) {
            porsi[menu] = Math.max(0, porsi[menu] + perubahan);
            hitungTotal();
        }

        function hitungTotal() {
            let totalPorsi = 0;
            let totalHarga = 0;

            for (const menu of Object.keys(porsi)) {
                const jumlah = porsi[menu];
                const subtotal = jumlah * harga[menu];

                document.getElementById(menu + 'Qty').textContent = jumlah;

                document.getElementById(menu + 'Total').textContent =
                    rupiah(subtotal);

                totalPorsi += jumlah;
                totalHarga += subtotal;
            }

            document.getElementById('totalQty').textContent = totalPorsi;

            document.getElementById('grandTotal').textContent =
                rupiah(totalHarga);

            // Update uang dan kembalian
            hitungPembayaran(totalHarga);
        }

        // Menambah uang yang diterima
        function tambahUang(nominal) {
            uangDiterima += nominal;
            hitungTotal();
        }

        // Menghitung uang dan kembalian
        function hitungPembayaran(totalHarga) {
            const kembali = Math.max(0, uangDiterima - totalHarga);

            document.getElementById('uang').textContent =
                rupiah(uangDiterima);

            document.getElementById('kembali').textContent =
                rupiah(kembali);
        }

        // Reset uang saja
        function resetUang() {
            uangDiterima = 0;
            hitungTotal();
        }

        // Reset semua: pesanan dan uang
        function resetKasir() {
            porsi.mie = 0;
            porsi.dimsum = 0;

            uangDiterima = 0;

            hitungTotal();
        }

        // Hitung nilai awal
        hitungTotal();

    </script>
</body>

</html>
