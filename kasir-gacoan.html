<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kasir Mie & Dimsum</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <style>
        :root {
            color-scheme: dark;
            --bs-body-bg: #09090b;
            --bs-body-color: #f4f4f5;
            --accent: #38bdf8;
            --surface: #141417;
            --border: #29292e;
            --muted: #a1a1aa;
        }

        body {
            overflow: hidden;
            touch-action: manipulation;
            min-height: 100vh;
            /* background: radial-gradient(ellipse at top, #17202a 0%, #09090b 48%); */
            background: #000000;
            font-family: 'JetBrains Mono', monospace;
        }

        .bg-custom1 {
            /* background: rgba(20, 20, 23, .92); */
            background: linear-gradient(145deg, #17212a, #121418);
        }

        .btn {
            touch-action: manipulation;
            background: linear-gradient(145deg, #17212a, #121418);
            height: 50px;
            /* background: rgba(20, 20, 23, .92); */
        }

        .kesimpulan {
            touch-action: manipulation;
            background: linear-gradient(145deg, #17212a, #121418);
        }

        .app {
            touch-action: manipulation;
            max-width: 540px;
            margin: auto;
            /* padding: 32px 16px; */
        }

        .order-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            /* margin-top: 10px; */
        }

        .qty-btn {
            /* width: 45px; */
            /* height: 45px; */
            flex-shrink: 0;
            border: 0px solid #3f3f46;
            border-radius: 14px;
            /* background: #27272a; */
            background: transparent;
            color: #fff;
            font-size: 26pt;
            display: grid;
            place-items: center;
            transition: background .15s, transform .15s;
            touch-action: manipulation;
        }

        .qty-btn:active {
            transform: scale(.7);
        }

        .qty-btn:hover {
            background: #3f3f46;
        }

        .qty-number {
            flex: 1;
            min-width: 0;
            text-align: center;
        }

        .qty-number strong {
            font-size: 24px;
            font-weight: 700;
        }

        .qty-number small {
            display: block;
            font-size: 11px;
            color: var(--muted);
            margin-top: 1px;
        }

        .tbl {
            transition: background .15s, transform .15s;
        }

        .tbl:active {
            transform: scale(.7);
        }
    </style>
</head>

<body>
    <main class="app p-3">

        <div class="text-center mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="7mm" height="7mm" version="1.1"
                style="shape-rendering:geometricPrecision; text-rendering:geometricPrecision; image-rendering:optimizeQuality; fill-rule:evenodd; clip-rule:evenodd"
                viewBox="0 0 4233.32 4233.32" xmlns:xlink="http://www.w3.org/1999/xlink"
                xmlns:xodm="http://www.corel.com/coreldraw/odm/2003">
                <g id="Layer_x0020_1">
                    <metadata id="CorelCorpID_0Corel-Layer" />
                    <path style="fill: white;"
                        d="M654.56 211.66c608.35,0 1216.66,0 1824.99,0 657.4,0 1194.44,537.01 1194.44,1194.42 0,568.06 -405.02,1059.88 -960.12,1171.23 -35.4,7.08 -34.77,6.42 -14.87,35.19 321.56,464.99 643.66,929.6 965.02,1394.72 10.84,15.69 11.71,14.4 -28.95,14.4 -200.86,0 -400.89,-0.16 -603.01,-0.16 -23.42,0 -45.37,-4.14 -64.4,-31.66 -314.1,-454.22 -628.46,-908.28 -942.65,-1362.43 -10.57,-15.26 -14.1,-16.73 -14.1,0.72l0 1298.29c0,52.61 -42.62,95.24 -95.22,95.24 -420.37,0 -840.74,0 -1261.13,0 -52.59,0 -95.25,-42.63 -95.24,-95.24 0,-1206.51 0,-2412.99 0,-3619.47 -0.01,-52.63 42.65,-95.25 95.24,-95.25zm1356.35 1810.61c0.48,51.91 42.48,93.9 94.42,94.35l374.22 0.02c390.32,0 710.57,-320.24 710.57,-710.56 0,-390.32 -320.25,-710.55 -710.57,-710.55l-1341.96 0c-51.94,0.45 -93.94,42.44 -94.42,94.38l0 2653.47c0.48,51.93 42.48,93.92 94.42,94.39l295.1 0c51.91,-0.47 93.9,-42.46 94.35,-94.39 0,-727.99 0,-1456.01 0,-2183.99 0,-52.6 42.65,-95.25 95.25,-95.25 294.33,0 588.65,0 882.98,0 52.62,0 95.25,42.65 95.25,95.25l0 293.36c0,52.61 -42.63,95.26 -95.25,95.26l-399.94 0c-51.94,0.48 -93.94,42.45 -94.42,94.38l0 279.88z" />
                </g>
            </svg>
        </div>

        <!-- RINGKASAN -->
        <div class="kesimpulan d-flex justify-content-between px-3 pt-2 rounded-top-4">
            <small>Total Porsi</small>
            <small>Total Bayar</small>
        </div>
        <div class="kesimpulan d-flex justify-content-between px-3 pb-2 rounded-bottom-4 fs-2 fw-bold">
            <div id="totalQty">0</div>
            <span class="text-info" id="grandTotal">Rp0</span>
        </div>
        <div class="mt-1 kesimpulan d-flex justify-content-between px-3 pt-2 rounded-top-4">
            <small>Uang</small>
            <small>Kembalian</small>
        </div>
        <div class="kesimpulan d-flex justify-content-between px-3 pb-2 rounded-bottom-4 fs-2 fw-bold">
            <span id="uang">0</span>
            <span class="text-success-emphasis" id="kembali">Rp0</span>
        </div>

        <div class="tbl text-center my-1 fs-1 text-danger" onclick="resetKasir()" type="button">
            <i class="fa-solid fa-trash"></i> HAPUS
        </div>

        <!-- Uang -->
        <div class="d-flex mb-1 justify-content-center">
            <div class="btn-group w-100" role="group">
                <button type="button" class="btn rounded-start-4 text-danger tbl fs-5" id="resetUang" onclick="resetUang()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <button type="button" class="btn tbl" onclick="tambahUang(1000)">1rb</button>
                <button type="button" class="btn tbl" onclick="tambahUang(2000)">2rb</button>
                <button type="button" class="btn tbl" onclick="tambahUang(5000)">5rb</button>
                <button type="button" class="btn rounded-end-4 tbl" onclick="tambahUang(10000)">10rb</button>
            </div>
        </div>
        <div class="d-flex justify-content-center">
            <div class="btn-group w-100" role="group">
                <button type="button" class="btn rounded-start-4 tbl" onclick="tambahUang(15000)">15rb</button>
                <button type="button" class="btn tbl" onclick="tambahUang(20000)">20rb</button>
                <button type="button" class="btn tbl" onclick="tambahUang(30000)">30rb</button>
                <button type="button" class="btn tbl" onclick="tambahUang(50000)">50rb</button>
                <button type="button" class="btn rounded-end-4 tbl" onclick="tambahUang(100000)">100rb</button>
            </div>
        </div>

        <div class="mt-1">

            <div class="d-flex gap-1">
                <!-- Mie -->
                <div class="d-grid w-100 p-2 bg-custom1 rounded-top-4">
                    <div class="text-center fs-5">Mie</div>
                    <div class="order-controls my-2">
                        <button class="qty-btn" onclick="ubahPorsi('mie', -1)" aria-label="Kurangi porsi mie">
                            <i class="fa-solid fa-square-minus"></i>
                        </button>

                        <div class="qty-number">
                            <strong id="mieQty">0</strong>
                        </div>

                        <button class="qty-btn" onclick="ubahPorsi('mie', 1)" aria-label="Tambah porsi mie">
                            <i class="fa-solid fa-square-plus"></i>
                        </button>
                    </div>
                    <div class="text-center" id="mieTotal">Rp0</div>
                </div>
                <!-- Dimsum -->
                <div class="d-grid w-100 p-2 bg-custom1 rounded-top-4">
                    <div class="text-center fs-5">Dimsum</div>
                    <div class="order-controls my-2">
                        <button class="qty-btn" onclick="ubahPorsi('dimsum', -1)" aria-label="Kurangi porsi dimsum">
                            <i class="fa-solid fa-square-minus"></i>
                        </button>

                        <div class="qty-number">
                            <strong id="dimsumQty">1</strong>
                        </div>

                        <button class="qty-btn" onclick="ubahPorsi('dimsum', 1)" aria-label="Tambah porsi dimsum">
                            <i class="fa-solid fa-square-plus"></i>
                        </button>
                    </div>
                    <div class="text-center" id="dimsumTotal">Rp0</div>
                </div>
            </div>

            <div class="d-flex gap-1">
                <div class="d-grid w-100 p-2 bg-custom1 rounded-bottom-4 border-top">
                    <div class="d-flex justify-content-between">
                        <button class="bg-transparent text-light tbl border-0" onclick="ubahPorsi('mie', -10)"
                            aria-label="Kurangi porsi mie">
                            -10
                        </button>
                        <button class="bg-transparent text-light tbl border-0" onclick="ubahPorsi('mie', -5)"
                            aria-label="Kurangi porsi mie">
                            -5
                        </button>
                        <button class="bg-transparent text-light tbl border-0" onclick="ubahPorsi('mie', 5)"
                            aria-label="Tambah porsi mie">
                            +5
                        </button>
                        <button class="bg-transparent text-light tbl border-0" onclick="ubahPorsi('mie', 10)"
                            aria-label="Kurangi porsi mie">
                            +10
                        </button>
                    </div>
                </div>
                <div class="d-grid w-100 p-2 bg-custom1 rounded-bottom-4 border-top">
                    <div class="d-flex justify-content-between">
                        <button class="bg-transparent text-light tbl border-0" onclick="ubahPorsi('dimsum', -10)"
                            aria-label="Kurangi porsi dimsum">
                            -10
                        </button>
                        <button class="bg-transparent text-light tbl border-0" onclick="ubahPorsi('dimsum', -5)"
                            aria-label="Kurangi porsi dimsum">
                            -5
                        </button>
                        <button class="bg-transparent text-light tbl border-0" onclick="ubahPorsi('dimsum', 5)"
                            aria-label="Kurangi porsi dimsum">
                            +5
                        </button>
                        <button class="bg-transparent text-light tbl border-0" onclick="ubahPorsi('dimsum', 10)"
                            aria-label="Kurangi porsi dimsum">
                            +10
                        </button>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <script>

        const harga = {
            mie: 14000,
            dimsum: 13000
        };

        const porsi = {
            mie: 0,
            dimsum: 0
        };

        // Uang yang diterima dari pelanggan
        let uangDiterima = 0;

        const rupiah = angka =>
            'Rp' + angka.toLocaleString('id-ID');

        function ubahPorsi(menu, perubahan) {
            porsi[menu] = Math.max(0, porsi[menu] + perubahan);
            hitungTotal();
        }

        function hitungTotal() {
            let totalPorsi = 0;
            let totalHarga = 0;

            for (const menu of Object.keys(porsi)) {
                const jumlah = porsi[menu];
                const subtotal = jumlah * harga[menu];

                document.getElementById(menu + 'Qty').textContent = jumlah;

                document.getElementById(menu + 'Total').textContent =
                    rupiah(subtotal);

                totalPorsi += jumlah;
                totalHarga += subtotal;
            }

            document.getElementById('totalQty').textContent = totalPorsi;

            document.getElementById('grandTotal').textContent =
                rupiah(totalHarga);

            // Update uang dan kembalian
            hitungPembayaran(totalHarga);
        }

        // Menambah uang yang diterima
        function tambahUang(nominal) {
            uangDiterima += nominal;
            hitungTotal();
        }

        // Menghitung uang dan kembalian
        function hitungPembayaran(totalHarga) {
            const kembali = Math.max(0, uangDiterima - totalHarga);
            // const kembali = uangDiterima - totalHarga;

            document.getElementById('uang').textContent =
                rupiah(uangDiterima);

            document.getElementById('kembali').textContent =
                rupiah(kembali);
        }

        // Reset uang saja
        function resetUang() {
            uangDiterima = 0;
            hitungTotal();
        }

        // Reset semua: pesanan dan uang
        function resetKasir() {
            porsi.mie = 0;
            porsi.dimsum = 0;

            uangDiterima = 0;

            hitungTotal();
        }

        // Hitung nilai awal
        hitungTotal();

    </script>
</body>

</html>
