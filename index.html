<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kalkulator Endog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <style>
        * {
            box-sizing: border-box;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        html,
        body {
            overflow: hidden;
        }

        :root {
            color-scheme: dark;
            --bg: #000;
            --panel: #101112;
            --border: #101112;
            --muted: #858b96;
            --white: #f5f6f7;
            --cyan: #55d5ec;
            --yellow: #ffcc60;
        }

        body {
            background: var(--bg);
            color: var(--white);
            font-family: 'JetBrains Mono', monospace;
            word-spacing: normal;
            min-height: 100vh;
            margin: 0;
        }

        .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .field-card {
            min-width: 0;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 17px;
            /* padding: 13px; */
            transition: border-color .2s;
        }

        .field-card:focus-within {
            /* border-color: #626971; */
            border-color: #002533;
            background: #002533;
        }

        .field-label {
            display: block;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .field-input {
            display: block;
            width: 100%;
            min-width: 0;
            padding: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--white);
            font-size: 22pt;
            font-weight: 600;
            text-align: left;
        }

        .field-input::placeholder {
            color: #454950;
        }

        .field-hint {
            border-top: 1px solid #858b96;
            margin-top: 5px;
            /* padding-top: 10px; */
            color: var(--muted);
            /* min-height: 29px; */
            white-space: nowrap;
        }

        .result-card {
            /* padding: 13px; */
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 17px;
        }

        .unit-slider {
            /* padding: 13px; */
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 17px;
        }

        .unit-slider .form-range {
            cursor: pointer;
            /* margin-bottom: 4px; */
        }

        .unit-slider .form-range::-webkit-slider-thumb {
            background: var(--bs-warning-text-emphasis);
        }

        .unit-slider .form-range::-moz-range-thumb {
            background: var(--bs-warning-text-emphasis);
        }


        .field-input-wrap {
            position: relative;
        }

        .field-input {
            padding-right: 26px;
        }

        .clear-field {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);

            display: none;
            align-items: center;
            justify-content: center;

            width: 23px;
            height: 23px;
            padding: 0;

            border: 0;
            border-radius: 50%;
            /* background: #292c30; */
            background: transparent;
            color: #b0b4bb;

            /* font-family: Arial, sans-serif; */
            font-size: 18pt;
            line-height: 1;
            cursor: pointer;
        }

        .clear-field.show {
            display: flex;
        }

        .clear-field:active {
            /* background: #454950; */
            background: transparent;
            color: white;
        }

        .hps{
            color: var(--bs-body-color);
        }
        .hps:active{
            color: var(--bs-light);
        }

        #anEtre::-webkit-slider-thumb {
            width: 40px;
            height: 20px;
            margin-top: -6px;
            cursor: pointer;
        }

        #anEtre::-moz-range-thumb {
            width: 40px;
            height: 20px;
            cursor: pointer;
        }


        @media (max-width: 360px) {
            .field-grid {
                gap: 8px;
            }

            .field-card {
                padding: 13px 11px;
            }

            .field-label {
                font-size: 12px;
            }
        }
    </style>
</head>

<body class="container">
    <main>

        <header class="d-flex justify-content-between align-items-center fs-5 mt-3 px-2 text-body">
            <span id="tanggal-hari-ini"></span>
            <svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="6mm" height="6mm" version="1.1"
                style="shape-rendering:geometricPrecision; text-rendering:geometricPrecision; image-rendering:optimizeQuality; fill-rule:evenodd; clip-rule:evenodd"
                viewBox="0 0 4233.32 4233.32" xmlns:xlink="http://www.w3.org/1999/xlink"
                xmlns:xodm="http://www.corel.com/coreldraw/odm/2003">
                <g id="Layer_x0020_1">
                    <metadata id="CorelCorpID_0Corel-Layer" />
                    <path style="fill: white;"
                        d="M654.56 211.66c608.35,0 1216.66,0 1824.99,0 657.4,0 1194.44,537.01 1194.44,1194.42 0,568.06 -405.02,1059.88 -960.12,1171.23 -35.4,7.08 -34.77,6.42 -14.87,35.19 321.56,464.99 643.66,929.6 965.02,1394.72 10.84,15.69 11.71,14.4 -28.95,14.4 -200.86,0 -400.89,-0.16 -603.01,-0.16 -23.42,0 -45.37,-4.14 -64.4,-31.66 -314.1,-454.22 -628.46,-908.28 -942.65,-1362.43 -10.57,-15.26 -14.1,-16.73 -14.1,0.72l0 1298.29c0,52.61 -42.62,95.24 -95.22,95.24 -420.37,0 -840.74,0 -1261.13,0 -52.59,0 -95.25,-42.63 -95.24,-95.24 0,-1206.51 0,-2412.99 0,-3619.47 -0.01,-52.63 42.65,-95.25 95.24,-95.25zm1356.35 1810.61c0.48,51.91 42.48,93.9 94.42,94.35l374.22 0.02c390.32,0 710.57,-320.24 710.57,-710.56 0,-390.32 -320.25,-710.55 -710.57,-710.55l-1341.96 0c-51.94,0.45 -93.94,42.44 -94.42,94.38l0 2653.47c0.48,51.93 42.48,93.92 94.42,94.39l295.1 0c51.91,-0.47 93.9,-42.46 94.35,-94.39 0,-727.99 0,-1456.01 0,-2183.99 0,-52.6 42.65,-95.25 95.25,-95.25 294.33,0 588.65,0 882.98,0 52.62,0 95.25,42.65 95.25,95.25l0 293.36c0,52.61 -42.63,95.26 -95.25,95.26l-399.94 0c-51.94,0.48 -93.94,42.45 -94.42,94.38l0 279.88z" />
                </g>
            </svg>
        </header>

        <hr class="border-2 rounded-pill">
        <form onsubmit="return false">
            <div class="field-grid gap-2">

                <div class="field-card rounded-4 p-3">
                    <!-- <label for="setel" class="field-label text-body">Setel <i class="fa-solid fa-egg"></i></label> -->
                    <div class="field-label text-body" id="kiloneEndog"><i class="fa-solid fa-egg"></i> Setel</div>
                    <div class="field-input-wrap">
                        <input class="field-input" autocomplete="off" type="number" id="setel" inputmode="numeric"
                            placeholder="0" oninput="etre(); calculate(); toggleClear('setel')"
                            style="letter-spacing: 1px;">
                        <button tabindex="-1" type="button" class="clear-field" id="clear-setel"
                            aria-label="Hapus Setel" onclick="clearInput('setel')"><i
                                class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="field-hint text-body"></div>
                    <!-- <div class="field-hint small text-body" id="kiloneEndog">× 15 kg</div> -->
                </div>

                <div class="field-card rounded-4 p-3">
                    <!-- <label for="harga" class="field-label text-body">Harga <i class="fa-solid fa-coins"></i></label> -->
                    <div class="field-label text-body" id="rupiah"><i class="fa-solid fa-coins"></i> Harga</div>
                    <div class="field-input-wrap">
                        <input class="field-input" autocomplete="off" type="number" id="harga" inputmode="numeric"
                            placeholder="0" oninput="calculate(); toggleClear('harga')" style="letter-spacing: 3px;">
                        <button tabindex="-1" type="button" class="clear-field" id="clear-harga"
                            aria-label="Hapus Harga" onclick="clearInput('harga')"><i
                                class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="field-hint text-body"></div>
                    <!-- <div class="field-hint small text-body" id="rupiah">Harga/kg</div> -->
                </div>

            </div>

            <section class="result-card rounded-4 my-2 p-3">
                <div class="d-flex justify-content-between mb-1">
                    <span class="text-body"><i class="bi bi-cash-stack"></i> Uang</span>
                    <span id="detailUang" class="text-light"></span>
                </div>
                <output class="text-info fw-bold fs-1" id="total">-</output>
            </section>

            <section class="unit-slider rounded-4 p-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="text-body col-auto"><i class="bi bi-inbox-fill"></i> EggTry</span>
                    <input type="range" class="form-range mx-3" id="anEtre" min="7" max="12" step="1" value="8"
                        oninput="etre()" />
                    <span id="etreValue" class="text-warning-emphasis fw-semibold text-end"
                        style="width: 21%;">8an</span>
                </div>
                <output class="text-warning-emphasis fw-semibold fs-3 my-1" id="etreTotal">-</output>
                <!-- <input type="range" class="form-range" id="anEtre" min="5" max="15" step="1" value="8" oninput="etre()" /> -->
            </section>

        </form>

        <div class="d-flex justify-content-between align-items-center mt-3 px-3 fw-bold" style="font-size: 14pt;">
            <div class="bg-transparent border-0 hps" onclick="bersihKalEndog()" type="button">
                <i class="fa-solid fa-trash-can"></i>
                HAPUS
            </div>
            <a tabindex="-1" href="https://justplay1793.github.io/pitik/kalpi.html"
                class="hps bg-transparent border-0 text-decoration-none text-end">Lainnya <i
                    class="fa-solid fa-arrow-right"></i></a>
        </div>

    </main>

    <script>

        function toggleClear(id) {
            const input = document.getElementById(id);
            const button = document.getElementById("clear-" + id);

            button.classList.toggle("show", input.value !== "");
        }

        function clearInput(id) {
            document.getElementById(id).value = "";

            if (id === "setel") {
                etre();
                calculate();
            } else if (id === "harga") {
                calculate();
            }

            toggleClear(id);
        }

        function tampilkanTanggalHariIni() {
            const hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            const bulan = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun",
                "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];

            const sekarang = new Date(
                new Date().toLocaleString("en-US", { timeZone: "Asia/Jakarta" })
            );

            // const tanggal = `${hari[sekarang.getDay()]}, ${sekarang.getDate()} ${bulan[sekarang.getMonth()]} ${sekarang.getFullYear()}`;
            const tanggal = `${hari[sekarang.getDay()]}, ${sekarang.getDate()} ${bulan[sekarang.getMonth()]} ${String(sekarang.getFullYear()).slice(-2)}`;

            document.getElementById("tanggal-hari-ini").innerHTML = '<i class="bi bi-calendar3"></i> ' + tanggal;
        }

        document.addEventListener("DOMContentLoaded", tampilkanTanggalHariIni);

        function convertNumber(input) {
            return input.replace(/,/g, ".");
        }

        function bersihKalEndog() {
            document.getElementById("setel").value = "";
            document.getElementById("harga").value = "";
            document.getElementById("anEtre").value = 8;
            document.getElementById("etreValue").textContent = "8an";
            document.getElementById("rupiah").innerHTML = '<i class="fa-solid fa-coins"></i> Harga';
            document.getElementById("total").textContent = "-";
            document.getElementById("detailUang").textContent = "";
            document.getElementById("etreTotal").textContent = "-";
            document.getElementById("kiloneEndog").innerHTML = '<i class="fa-solid fa-egg"></i> Setel';
            toggleClear("setel");
            toggleClear("harga");
        }

        function calculate() {
            const setelVal = document.getElementById("setel").value;
            const hargaVal = document.getElementById("harga").value;
            const output = document.getElementById("total");

            // Hitung kilogram telur
            const kiloOutput = document.getElementById("kiloneEndog");

            if (!setelVal) {
                kiloOutput.innerHTML = '<i class="fa-solid fa-egg"></i> Setel';
            } else {
                const setel = parseFloat(convertNumber(setelVal));
                const kilone = setel * 15;

                kiloOutput.innerHTML =
                    '<i class="fa-solid fa-egg"></i> ' +
                    kilone.toLocaleString("id-ID") + 'kg';
            }

            // Jika harga kosong
            if (!hargaVal) {
                document.getElementById("rupiah").innerHTML =
                    '<i class="fa-solid fa-coins"></i> Harga';
                output.textContent = "-";
                document.getElementById("detailUang").textContent = "";
                return;
            }

            // Konversi harga
            let harga = hargaVal;

            if (harga.includes(",") || harga.includes(".")) {
                harga = parseFloat(convertNumber(harga)) * 1000;
            } else if (harga.length <= 2) {
                harga = parseFloat(harga) * 1000;
            } else if (harga.length === 3 && harga.substring(1) === "00") {
                harga = parseFloat(harga);
            } else if (harga.length === 3) {
                const d2 = parseInt(harga.substring(0, 2));
                const d1 = parseInt(harga.substring(2));
                harga = (d2 * 1000) + (d1 * 100);
            } else {
                harga = parseFloat(harga);
            }

            document.getElementById("rupiah").innerHTML =
                '<i class="fa-solid fa-coins"></i> Rp' +
                harga.toLocaleString("id-ID") + '/kg';

            // Jika setel kosong, harga tetap ditampilkan
            if (!setelVal) {
                output.textContent = "-";
                document.getElementById("detailUang").textContent = "";
                return;
            }

            // Hitung total uang
            const setel = parseFloat(convertNumber(setelVal));
            const result = setel * 15 * harga;

            output.textContent = "Rp " + result.toLocaleString("id-ID");
            document.getElementById("detailUang").textContent =
                `${setel.toLocaleString("id-ID")}×15×Rp${harga.toLocaleString("id-ID")}`;
        }

        function etre() {
            const slider = document.getElementById("anEtre");
            const satuan = parseInt(slider.value);
            document.getElementById("etreValue").textContent = satuan + "an";

            const input = document.getElementById("setel").value;
            const output = document.getElementById("etreTotal");

            if (input === "") {
                output.textContent = "-";
                return;
            }

            const etreIn = parseFloat(input.replace(/[,.]/g, ""));
            const setel = etreIn * satuan;
            const total = Math.floor(setel / 70);
            const lembar = setel % 70;

            if (lembar === 0) {
                output.textContent = total.toLocaleString("id-ID") + " ikat";
            } else if (setel < 70) {
                output.textContent = lembar.toLocaleString("id-ID") + " lembar";
            } else {
                output.textContent =
                    total.toLocaleString("id-ID") + " ikat + " +
                    lembar.toLocaleString("id-ID") + " lembar";
            }
        }

        window.addEventListener("scroll", () => {
            if (window.scrollY > 0) {
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            }
        });
    </script>
</body>

</html>
