<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kalkulator Endog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

    <style>
        * {
            box-sizing: border-box;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        :root {
            color-scheme: dark;
            --bg: #08090a;
            --panel: #101112;
            --border: #292c30;
            --muted: #858b96;
            --white: #f5f6f7;
            --cyan: #55d5ec;
            --yellow: #ffcc60;
        }

        body {
            /* background: var(--bg); */
            background: #000;
            color: var(--white);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.6px;
            word-spacing: normal;
            min-height: 100vh;
            margin: 0;
        }

        .app {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: 24px 18px 32px;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .brand-icon {
            font-size: 34px;
            color: var(--white);
        }

        .brand-name {
            font-size: 27px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -1.5px;
        }

        .brand-subtitle {
            color: var(--muted);
            font-size: 11px;
            margin-top: 4px;
        }

        .clear-btn {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: #17191c;
            color: var(--white);
            font-size: 19px;
            transition: background .2s;
        }

        .clear-btn:active {
            background: #30343a;
        }

        .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .field-card {
            min-width: 0;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 16px 15px 13px;
            transition: border-color .2s;
        }

        .field-card:focus-within {
            border-color: #626971;
        }

        .field-label {
            display: block;
            color: var(--muted);
            /* font-size: 12px; */
            margin-bottom: 10px;
        }

        .field-input {
            display: block;
            width: 100%;
            min-width: 0;
            padding: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--white);
            font-family: inherit;
            font-size: clamp(23px, 7vw, 31px);
            font-weight: 600;
            text-align: left;
            letter-spacing: -1.5px;
        }

        .field-input::placeholder {
            color: #454950;
        }

        .field-hint {
            border-top: 1px solid #36393e;
            margin-top: 11px;
            padding-top: 10px;
            color: var(--muted);
            /* font-size: 10px; */
            min-height: 29px;
            white-space: nowrap;
        }

        .result-card {
            margin-top: 13px;
            padding: 17px 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 17px;
        }

        .result-label {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 6px;
        }

        .result-value {
            color: var(--cyan);
            font-size: clamp(25px, 7vw, 34px);
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -1.5px;
            overflow-wrap: anywhere;
        }

        .eggtry-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            margin-top: 13px;
        }

        .eggtry-card {
            min-width: 0;
            padding: 15px 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 17px;
        }

        .eggtry-value {
            color: var(--yellow);
            font-size: clamp(18px, 5vw, 23px);
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .unit-select {
            width: 83px;
            padding: 10px 8px;
            background-color: var(--panel);
            color: var(--white);
            border: 1px solid var(--border);
            border-radius: 17px;
            font-family: inherit;
            font-size: 12px;
            outline: none;
        }

        .info-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            margin-top: 27px;
            padding-top: 19px;
            border-top: 1px solid #25272b;
        }

        .info-item {
            min-width: 0;
            padding: 0 8px;
            text-align: center;
        }

        .info-item + .info-item {
            border-left: 1px solid #25272b;
        }

        .info-icon {
            color: #c7cbd1;
            font-size: 19px;
            margin-bottom: 5px;
        }

        .info-title {
            font-size: 10px;
            color: #c7cbd1;
        }

        .info-desc {
            margin-top: 4px;
            font-size: 9px;
            color: var(--muted);
        }

        .unit-slider {
            padding: 12px 14px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 12px;
        }

        .unit-slider .form-range {
            cursor: pointer;
            margin-bottom: 4px;
        }

        .unit-slider .form-range::-webkit-slider-thumb {
            background: #eee;
        }

        .unit-slider .form-range::-moz-range-thumb {
            background: #eee;
        }

        @media (max-width: 360px) {
            .app {
                padding: 20px 12px;
            }

            .field-grid {
                gap: 8px;
            }

            .field-card {
                padding: 13px 11px;
            }

            .field-hint {
                font-size: 9px;
            }

            .brand-name {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
<main class="app">

    <header class="text-center">
        <i class="bi bi-calendar3"></i>
        <span id="tanggal-hari-ini"></span>
    </header>

    <form onsubmit="return false">
        <div class="field-grid my-2">

            <div class="field-card">
                <label for="setel" class="field-label small text-body">Setel <i class="fa-solid fa-egg"></i></label>
                <input
                    class="field-input"
                    autocomplete="off"
                    type="number"
                    id="setel"
                    inputmode="numeric"
                    placeholder="0"
                    oninput="etre(); calculate(); kiloEndog();"
                >
                <div class="field-hint small text-body" id="kiloneEndog">× 15 kg</div>
            </div>

            <div class="field-card">
                <label for="harga" class="field-label small text-body">Harga <i class="fa-solid fa-coins"></i></label>
                <input
                    class="field-input"
                    autocomplete="off"
                    type="number"
                    id="harga"
                    inputmode="numeric"
                    placeholder="0"
                    oninput="calculate()"
                >
                <div class="field-hint small text-body" id="rupiah">Harga/kg</div>
            </div>

        </div>

        <section class="result-card">
            <div class="small text-body">Uang <i class="bi bi-cash-stack"></i></div>
            <output class="text-info fw-bold fs-1" id="total">-</output>
        </section>

        <section class="eggtry-card my-2">
            <div class="small text-body">EggTry <i class="bi bi-inboxes-fill"></i></div>
            <output class="text-warning-emphasis fw-semibold fs-4" id="etreTotal">-</output>
        </section>

        <div class="unit-slider rounded-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="anEtre" class="text-body small">
                    Satuan EggTry
                    <i class="bi bi-inbox-fill"></i>
                </label>

                <span id="etreValue" class="text-warning-emphasis fw-semibold fs-5">8an</span>
            </div>

            <input
                type="range"
                class="form-range"
                id="anEtre"
                min="5"
                max="15"
                step="1"
                value="8"
                oninput="etre()"
            />

            <div class="d-flex justify-content-between text-body small">
                <span>5an</span>
                <span>15an</span>
            </div>
        </div>
        
    </form>

    <div class="d-grid my-2">
        <button type="button" class="btn btn-lg btn-outline-secondary rounded-5"
                aria-label="Bersihkan kalkulator"
                onclick="bersihKalEndog()">
            <i class="fa-solid fa-trash-can"></i>
            HAPUS SEMUA
        </button>
    </div>

    <div class="d-grid">
        <a href="https://justplay1793.github.io/pitik/kalpi.html" class="text-body text-end btn btn-sm rounded-5">Selengkapnya <i class="fa-solid fa-arrow-right"></i></a>
    </div>

</main>

<script>
    function tampilkanTanggalHariIni() {
        const hariMingguan = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const pasaranJawa = ["Legi", "Pahing", "Pon", "Wage", "Kliwon"];
        // const bulanSingkat = ["Januari", "Februari", "Maret", "April", "Mei", "Juni",
        //                         "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const bulanSingkat = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun",
                                "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
        const bulanHijriah = ["Muharram", "Safar", "Rabiul Awal", "Rabiul Akhir", "Jumadil Awal",
                                "Jumadil Akhir", "Rajab", "Syaban", "Ramadhan", "Syawal", "Zulkaidah", "Zulhijah"];
        const bulanJawa = ["Suro", "Sapar", "Mulud", "Bakdo Mulud", "Jumadil Awal", "Jumadil Akhir",
                            "Rejeb", "Ruwah", "Poso", "Sawal", "Dulkaidah", "Besar"];

        // Acuan: Sabtu Wage, 26 Juli 2025
        const tanggalAcuan = new Date("2025-07-26");
        const sekarang = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Jakarta" }));

        const tglAcuan = new Date(tanggalAcuan.getFullYear(), tanggalAcuan.getMonth(), tanggalAcuan.getDate());
        const tglSekarang = new Date(sekarang.getFullYear(), sekarang.getMonth(), sekarang.getDate());
        const selisih = Math.round((tglSekarang - tglAcuan) / (1000 * 60 * 60 * 24));

        const hariIndex = (6 + selisih % 7 + 7) % 7;     // 6 = Sabtu
        const pasaranIndex = (3 + selisih % 5 + 5) % 5;  // 3 = Wage
        // const hariPasaran = `${hariMingguan[hariIndex]} ${pasaranJawa[pasaranIndex]}`;
        const hariPasaran = `${hariMingguan[hariIndex]}`;
        const tanggalSingkat = `${tglSekarang.getDate()} ${bulanSingkat[tglSekarang.getMonth()]} ${tglSekarang.getFullYear()}`;

        // === Hitung Hijriah ===
        function masehiKeHijriah(date) {
            const day = date.getDate();
            const month = date.getMonth() + 1;
            const year = date.getFullYear();

            let m = month;
            let y = year;
            if (m < 3) { y -= 1; m += 12; }

            const a = Math.floor(y / 100);
            const b = 2 - a + Math.floor(a / 4);
            const jd = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + day + b - 1524.5;
            const l = jd - 1948440 + 10632;
            const n = Math.floor((l - 1) / 10631);
            const r = l - 10631 * n + 354;
            const j = (Math.floor((10985 - r) / 5316)) * (Math.floor((50 * r) / 17719))
                    + (Math.floor(r / 5670)) * (Math.floor((43 * r) / 15238));
            const k = r - (Math.floor((30 - j) / 15)) * (Math.floor((17719 * j) / 50))
                    - (Math.floor(j / 16)) * (Math.floor((15238 * j) / 43)) + 29;
            const bulan = Math.floor((24 * k) / 709);
            let tanggal = k - Math.floor((709 * bulan) / 24);
            const tahun = 30 * n + j - 30;

            tanggal = Math.round(tanggal);
            return { tanggal, bulan, tahun };
        }

        const h = masehiKeHijriah(tglSekarang);
        const tanggalHijriah = `${h.tanggal} ${bulanHijriah[h.bulan - 1]} ${h.tahun} H`;
        const tanggalHijriahJawa = `${h.tanggal} ${bulanJawa[h.bulan - 1]} ${h.tahun} Jawa`;

        // Gabung jadi format baru
        const hijriahGabung = `${h.tanggal} ${bulanHijriah[h.bulan - 1]} (${bulanJawa[h.bulan - 1]}) ${h.tahun}`;

        document.getElementById('tanggal-hari-ini').innerHTML =
            `${hariPasaran}, ${tanggalSingkat}`;
    }

    document.addEventListener("DOMContentLoaded", tampilkanTanggalHariIni);
    
    function convertNumber(input) {
        return input.replace(/,/g, ".");
    }

    function bersihKalEndog() {
        document.getElementById("setel").value = "";
        document.getElementById("harga").value = "";
        document.getElementById("anEtre").value = 8;
        document.getElementById("etreValue").textContent = "8an";
        document.getElementById("rupiah").textContent = "Harga/kg";
        document.getElementById("total").textContent = "-";
        document.getElementById("etreTotal").textContent = "-";
        document.getElementById("kiloneEndog").textContent = "× 15 kg";
    }

    function calculate() {
        const setelVal = document.getElementById("setel").value;
        const hargaVal = document.getElementById("harga").value;
        const output = document.getElementById("total");

        if (!setelVal || !hargaVal) {
            output.textContent = "Rp 0";
            document.getElementById("rupiah").textContent = "Harga/kg";
            return;
        }

        const setel = parseFloat(convertNumber(setelVal));
        let harga = hargaVal;

        if (harga.includes(",") || harga.includes(".")) {
            harga = parseFloat(convertNumber(harga)) * 1000;
        } else if (harga.length <= 2) {
            harga = parseFloat(harga) * 1000;
        } else if (harga.length === 3 && harga.substring(1) === "00") {
            harga = parseFloat(harga);
        } else if (harga.length === 3) {
            const d2 = parseInt(harga.substring(0, 2));
            const d1 = parseInt(harga.substring(2));
            harga = (d2 * 1000) + (d1 * 100);
        } else {
            harga = parseFloat(harga);
        }

        const result = setel * 15 * harga;
        document.getElementById("rupiah").textContent = "Rp " + harga.toLocaleString() + "/kg";
        output.textContent = "Rp " + result.toLocaleString("id-ID");
    }

    function kiloEndog() {
        const input = document.getElementById("setel").value;
        const output = document.getElementById("kiloneEndog");

        if (input === "") {
            output.textContent = "× 15 kg";
        } else {
            const stl = input;
            const kilone = parseFloat(input.replace(/[,.]/g, "")) * 15;
            output.textContent =
                // stl.toLocaleString("id-ID") + " Setel (" +
                kilone.toLocaleString("id-ID") + " Kg";
        }
    }

    function etre() {
        const slider = document.getElementById("anEtre");
        const satuan = parseInt(slider.value);
        document.getElementById("etreValue").textContent =
            // satuan + (satuan <= 9 ? "an" : "");
            satuan + "an";
        
        const input = document.getElementById("setel").value;
        const output = document.getElementById("etreTotal");
        
        if (input === "") {
            output.textContent = "-";
            return;
        }
    
        const etreIn = parseFloat(input.replace(/[,.]/g, ""));
        const setel = etreIn * satuan;
        const total = Math.floor(setel / 70);
        const lembar = setel % 70;
    
        if (lembar === 0) {
            output.textContent = total.toLocaleString("id-ID") + " ikat";
        } else if (setel < 70) {
            output.textContent = lembar.toLocaleString("id-ID") + " lembar";
        } else {
            output.textContent =
                total.toLocaleString("id-ID") + " ikat + " +
                lembar.toLocaleString("id-ID") + " lembar";
        }
    }
</script>
</body>
</html>
