<!-- password generator -->
<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Password Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            color-scheme: dark;
            --bg: #000000;
            --surface: #111113;
            --border: #27272a;
            --muted: #a1a1aa;
            --accent: #fafafa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: #ffffff;
            font-family: "JetBrains Mono", monospace;
        }

        .app {
            width: 100%;
            max-width: 460px;
        }

        .panel {
            background: var(--surface);
        }

        .password-box {
            position: relative;
        }

        #password {
            width: 100%;
            padding: 15px;
            display: block;
            overflow-wrap: anywhere;
            word-break: break-all;
            background: var(--bg);
            border-radius: 12px;
            color: #fafafa;
            font-weight: 600;
            line-height: 1.8;
            text-align: center;
            user-select: all;
        }

        .form-range {
            cursor: pointer;
            accent-color: #fafafa;
        }

        .range-labels {
            color: var(--muted);
        }

        .status {
            color: var(--surface);
            user-select: all;
        }

        .tbl-bg {
            background: var(--bg);
        }

        #length::-webkit-slider-thumb {
            width: 60px;
            height: 30px;
            margin-top: -11px;
            cursor: grab;
            background: var(--bs-info);
        }

        #length::-moz-range-thumb {
            width: 60px;
            height: 30px;
            cursor: grab;
            background: var(--bs-info);
        }

        @media (max-width: 380px) {
            .panel {
                padding: 17px;
            }

            #password {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="app">

        <header class="d-flex justify-content-between mb-1 px-3">
            <h4 class="">Password Generator</h4>
            <svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="7mm" height="7mm" version="1.1"
                style="shape-rendering:geometricPrecision; text-rendering:geometricPrecision; image-rendering:optimizeQuality; fill-rule:evenodd; clip-rule:evenodd"
                viewBox="0 0 4233.32 4233.32" xmlns:xlink="http://www.w3.org/1999/xlink"
                xmlns:xodm="http://www.corel.com/coreldraw/odm/2003">
                <g id="Layer_x0020_1">
                    <metadata id="CorelCorpID_0Corel-Layer" />
                    <path style="fill: white;"
                        d="M654.56 211.66c608.35,0 1216.66,0 1824.99,0 657.4,0 1194.44,537.01 1194.44,1194.42 0,568.06 -405.02,1059.88 -960.12,1171.23 -35.4,7.08 -34.77,6.42 -14.87,35.19 321.56,464.99 643.66,929.6 965.02,1394.72 10.84,15.69 11.71,14.4 -28.95,14.4 -200.86,0 -400.89,-0.16 -603.01,-0.16 -23.42,0 -45.37,-4.14 -64.4,-31.66 -314.1,-454.22 -628.46,-908.28 -942.65,-1362.43 -10.57,-15.26 -14.1,-16.73 -14.1,0.72l0 1298.29c0,52.61 -42.62,95.24 -95.22,95.24 -420.37,0 -840.74,0 -1261.13,0 -52.59,0 -95.25,-42.63 -95.24,-95.24 0,-1206.51 0,-2412.99 0,-3619.47 -0.01,-52.63 42.65,-95.25 95.24,-95.25zm1356.35 1810.61c0.48,51.91 42.48,93.9 94.42,94.35l374.22 0.02c390.32,0 710.57,-320.24 710.57,-710.56 0,-390.32 -320.25,-710.55 -710.57,-710.55l-1341.96 0c-51.94,0.45 -93.94,42.44 -94.42,94.38l0 2653.47c0.48,51.93 42.48,93.92 94.42,94.39l295.1 0c51.91,-0.47 93.9,-42.46 94.35,-94.39 0,-727.99 0,-1456.01 0,-2183.99 0,-52.6 42.65,-95.25 95.25,-95.25 294.33,0 588.65,0 882.98,0 52.62,0 95.25,42.65 95.25,95.25l0 293.36c0,52.61 -42.63,95.26 -95.25,95.26l-399.94 0c-51.94,0.48 -93.94,42.45 -94.42,94.38l0 279.88z" />
                </g>
            </svg>
        </header>

        <section class="panel p-3 rounded-4">

            <div class="d-flex align-items-center justify-content-between" style="font-size: 14pt;">
                <output id="lengthValue" for="length" class="fw-bold text-info">10 karakter</output>
                <div type="button" class="fw-bold border-bottom border-2" id="copyBtn">
                    <i class="bi bi-copy"></i>
                    Copy
                </div>
            </div>

            <div class="password-box my-3">
                <output id="password" aria-live="polite">Memproses...</output>
            </div>

            <input type="range" class="form-range" id="length" min="6" max="24" step="1" value="10"
                aria-label="Panjang password">

            <!-- <div class="d-flex fs-6 justify-content-between range-labels mt-1">
                <span>6</span>
                <span>24</span>
            </div> -->

            <div class="d-flex gap-2">
                <button type="button" class="tbl-bg btn rounded-pill w-100 d-none" id="generateBtn">
                    <i class="bi bi-arrow-clockwise"></i>
                    Generate
                </button>

                <!-- <button type="button" class="tbl-bg btn rounded-pill w-100 d-none" id="copyBtn">
                    <i class="bi bi-copy"></i>
                    Copy
                </button> -->
            </div>

            <div id="status" class="status fs-6 text-center mt-1" role="status" aria-live="polite">.</div>

        </section>

    </main>

    <script>
        "use strict";

        const $ = id => document.getElementById(id);

        const slider = $("length");
        const lengthValue = $("lengthValue");
        const passwordOutput = $("password");
        const generateBtn = $("generateBtn");
        const copyBtn = $("copyBtn");
        const status = $("status");

        // Kelompok karakter password.
        const groups = [
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
            "abcdefghijklmnopqrstuvwxyz",
            "0123456789",
            "!@#$%^&*()-_=+[]{};:,.?"
        ];

        const allCharacters = groups.join("");

        // Random integer tanpa modulo bias.
        function secureRandomInt(max) {
            if (!Number.isSafeInteger(max) || max < 1 ||
                max > 0x100000000) {
                throw new RangeError("Batas random tidak valid.");
            }

            const range = 0x100000000;
            const limit = range - (range % max);
            const buffer = new Uint32Array(1);

            do {
                crypto.getRandomValues(buffer);
            } while (buffer[0] >= limit);

            return buffer[0] % max;
        }

        // Fisher-Yates shuffle dengan random yang aman.
        function secureShuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = secureRandomInt(i + 1);
                [array[i], array[j]] = [array[j], array[i]];
            }

            return array;
        }

        function generatePassword() {
            const length = Number(slider.value);
            const chars = [];

            // Ambil minimal satu karakter dari setiap kelompok.
            for (const group of groups) {
                chars.push(group[secureRandomInt(group.length)]);
            }

            // Isi sisa password dari seluruh kelompok karakter.
            while (chars.length < length) {
                chars.push(
                    allCharacters[secureRandomInt(allCharacters.length)]
                );
            }

            // Acak posisi seluruh karakter.
            secureShuffle(chars);

            passwordOutput.textContent = chars.join("");
            lengthValue.textContent = length + " karakter";
            // status.innerHTML = '<div style="color: var(--surface);">.</div>';
            copyBtn.innerHTML =
                '<i class="bi bi-copy"></i> Copy';
        }

        slider.addEventListener("input", generatePassword);

        generateBtn.addEventListener("click", generatePassword);

        copyBtn.addEventListener("click", async () => {
            const password = passwordOutput.textContent;

            try {
                await navigator.clipboard.writeText(password);

                copyBtn.innerHTML =
                    '<div class="fw-bold text-info"><i class="bi bi-check-lg"></i> Copied!</div>';
                // status.textContent = "Password berhasil disalin.";
                status.innerHTML = '<div class="fw-bold text-success">' + document.getElementById("password").value + '</div>';

            } catch (error) {
                // Fallback jika Clipboard API tidak tersedia.
                const selection = window.getSelection();
                const range = document.createRange();

                range.selectNodeContents(passwordOutput);
                selection.removeAllRanges();
                selection.addRange(range);

                status.textContent =
                    "Pilih password di atas, lalu salin secara manual.";

                passwordOutput.focus?.();
            }
        });

        // Generate password otomatis saat halaman siap.
        document.addEventListener("DOMContentLoaded", generatePassword);

        // Jalankan juga jika script dieksekusi setelah DOM siap.
        if (document.readyState !== "loading") {
            generatePassword();
        }
    </script>

</body>

</html>
